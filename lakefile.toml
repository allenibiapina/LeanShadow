name = "LeanShadow"
version = "0.1.0"
defaultTargets = ["LeanShadow"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[require]]
name = "Comparator"
scope = "leanprover"
git = "https://github.com/leanprover/comparator.git"
rev = "3927ad383f208ae977c340a91c48ac9b497d2097"

[[lean_lib]]
name = "LeanShadow"
globs = ["LeanShadow", "LeanShadow.+"]

[[lean_lib]]
name = "ComparatorChallenges"
globs = ["ComparatorChallenges.+"]
